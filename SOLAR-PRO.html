<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a23">
<meta name="description" content="SOLAR PRO : dimensionnement photovoltaïque et gestion d'entreprise solaire — clients, stocks, devis et factures, interventions et paiements Mobile Money.">
<title>SOLAR PRO 1.7 — Dossier projet centralisé</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230b2a23'/%3E%3Ccircle cx='20' cy='20' r='8' fill='%23ffb000'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
--ink:#12211c;--muted:#5d6f68;--faint:#8a9b94;--line:#dfe6e1;--bg:#f3f6f3;--panel:#fff;
--forest:#0b2a23;--forest2:#14403a;--leaf:#0f7b5f;--leaf-d:#0a5e48;--leaf-l:#e3f3ec;
--sun:#ffb000;--sun-d:#c98200;--sun-l:#fff3d1;--red:#c63a3a;--red-l:#fbe9e9;--blue:#2a62c4;--blue-l:#e6eefb;
--r-s:6px;--r-m:12px;--r-l:20px;--side:248px;--top:60px;
--f-d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--f-b:'Instrument Sans','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-b);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;min-height:100vh}
h1,h2,h3,h4{font-family:var(--f-d);font-weight:700;letter-spacing:-.01em;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--leaf-d)}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-.2em}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

/* ===== Shell ===== */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{background:var(--forest);color:#cfe3db;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:#fff;font-family:var(--f-d);font-weight:800;font-size:18px}
.brand .sun{width:34px;height:34px;flex-shrink:0}
.brand small{display:block;font-family:var(--f-b);font-weight:500;font-size:11.5px;color:#8fb3a6;margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:4px 10px 16px}
.nav h5{font-family:var(--f-b);font-size:12px;font-weight:600;color:#7fa497;padding:14px 10px 5px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:#cfe3db;text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a[aria-current=page]{background:var(--sun);color:var(--forest);font-weight:700}
.quick{display:flex;align-items:center;gap:11px;margin:2px 10px 6px;padding:11px 12px;border-radius:10px;background:var(--sun);color:var(--forest);font-weight:700;text-decoration:none}
.quick:hover{background:#ffc233}
.quick2{background:rgba(255,255,255,.1);color:#fff;margin-top:0}
.quick2:hover{background:rgba(255,255,255,.18)}
.quick2[aria-current=page]{background:var(--sun);color:var(--forest)}
.quick[aria-current=page]{box-shadow:0 0 0 2px #fff inset}
.navbtns{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sidefoot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.sidefoot .who{flex:1;min-width:0;font-size:13px;line-height:1.25}
.sidefoot .who b{display:block;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidefoot .who span{color:#8fb3a6;font-size:12px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--sun);color:var(--forest);display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
.main{min-width:0;display:flex;flex-direction:column}
.top{height:var(--top);background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px;position:sticky;top:0;z-index:30}
.ibtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);position:relative;flex-shrink:0}
.ibtn:hover{background:var(--bg);color:var(--ink)}
.ibtn .dot{position:absolute;top:6px;right:5px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.gsearch{flex:1;max-width:480px;position:relative}
.gsearch input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px 0 38px}
.gsearch input:focus{background:#fff;border-color:var(--leaf);outline:none}
.gsearch>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.gres{position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 14px 40px rgba(11,42,35,.16);max-height:380px;overflow:auto;z-index:50}
.gres button{display:flex;width:100%;gap:10px;align-items:center;justify-content:space-between;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
.gres button:hover{background:var(--leaf-l)}
.gres small{color:var(--faint)}
.spacer{flex:1}
.content{padding:26px;max-width:1320px;width:100%;margin:0 auto;flex:1}
.bnav{display:none}
.pop{position:fixed;top:var(--top);right:16px;width:340px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 14px 40px rgba(11,42,35,.18);z-index:60;max-height:70vh;overflow:auto}
.pop h4{padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px}
.pop .al{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
.pop .al svg{margin-top:2px}.pop .al.warn svg{color:var(--sun-d)}.pop .al.bad svg{color:var(--red)}.pop .al.ok svg{color:var(--leaf)}

/* ===== Page header ===== */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:28px}
.ph p{color:var(--muted);margin-top:4px;max-width:60ch}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

button.link{color:var(--leaf-d);text-decoration:underline;font-size:inherit;padding:0}
/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid transparent;white-space:nowrap;transition:background .15s,border-color .15s}
.btn-p{background:var(--leaf);color:#fff}.btn-p:hover{background:var(--leaf-d)}
.btn-s{background:var(--sun);color:var(--forest)}.btn-s:hover{background:#f2a600}
.btn-o{background:#fff;border-color:var(--line);color:var(--ink)}.btn-o:hover{border-color:var(--leaf);color:var(--leaf-d)}
.btn-d{background:var(--red);color:#fff}
.btn-g{color:var(--muted)}.btn-g:hover{background:var(--bg);color:var(--ink)}
.btn-sm{height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn-ic{width:32px;height:32px;padding:0;border-radius:8px;color:var(--muted);display:inline-grid;place-items:center}
.btn-ic:hover{background:var(--bg);color:var(--ink)}.btn-ic.del:hover{background:var(--red-l);color:var(--red)}
.btn[disabled]{opacity:.55;cursor:not-allowed}

/* ===== Panels & layout ===== */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m)}
.panel>header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel>header h3{font-size:16px}
.panel .pb{padding:18px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.stack>*+*{margin-top:18px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.strong{font-weight:600}.right{text-align:right}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ===== Hero: sun arc ===== */
.hero{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:28px;align-items:center;padding:24px 28px;background:var(--forest);color:#fff;border-radius:var(--r-l);margin-bottom:22px;overflow:hidden;position:relative}
.hero h2{font-size:15px;font-weight:600;color:#a9cbbd;margin-bottom:2px}
.arc{width:100%;height:auto;display:block}
.arc .big{font-family:var(--f-d);font-weight:800;font-size:30px;fill:#fff}
.arc .sub{font-size:12.5px;fill:#a9cbbd}
.hero .facts{display:grid;grid-template-columns:repeat(2,1fr);gap:0}
.fact{padding:14px 18px;border-left:1px solid rgba(255,255,255,.14)}
.fact:nth-child(-n+2){border-bottom:1px solid rgba(255,255,255,.14)}
.fact span{display:block;font-size:13px;color:#a9cbbd}
.fact b{display:block;font-family:var(--f-d);font-size:24px;margin-top:2px}
.fact b.bad{color:#ff9a8f}.fact b.ok{color:#8fe3b8}
.fact small{color:#a9cbbd;font-size:12px}

/* ===== Tables ===== */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafcfb}
th[data-sort]{cursor:pointer;user-select:none}th[data-sort]:hover{color:var(--ink)}
td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafcfb}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .sub{display:block;color:var(--faint);font-size:12.5px}
.tools{display:flex;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.tools input,.tools select{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff}
.tools input[type=search]{min-width:240px;flex:1;max-width:360px}
.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--leaf-l);color:var(--leaf-d)}.p-warn{background:var(--sun-l);color:#8a5a00}.p-bad{background:var(--red-l);color:var(--red)}.p-info{background:var(--blue-l);color:var(--blue)}.p-mute{background:#edf1ef;color:var(--muted)}
.bar{height:7px;background:#e8eeea;border-radius:9px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:9px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty svg{width:34px;height:34px;color:var(--faint);margin-bottom:10px}
.empty h4{color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:14px}

/* ===== Forms ===== */
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.fg .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 11px;background:#fff}
.fld textarea{height:auto;min-height:76px;padding:9px 11px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--leaf);outline:2px solid var(--leaf-l)}
.fld .hint{font-size:12.5px;color:var(--faint)}
.fld.err input,.fld.err select{border-color:var(--red)}
.ferr{background:var(--red-l);color:var(--red);padding:10px 12px;border-radius:8px;font-size:13.5px;margin-bottom:14px}
.ferr:empty{display:none}
.lines{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(140px,2fr) 70px 110px 34px;gap:8px;align-items:center}
.lrow input,.lrow select{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 9px;width:100%;background:#fff}
.totals{margin-left:auto;max-width:300px;margin-top:14px}
.totals div{display:flex;justify-content:space-between;padding:4px 0}
.totals .tt{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-family:var(--f-d);font-size:19px;font-weight:700}

/* ===== Dialog / toast ===== */
dialog{border:0;border-radius:var(--r-l);padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 30px 80px rgba(11,42,35,.35);color:var(--ink);overflow:hidden}
dialog.lg{width:min(920px,calc(100vw - 24px))}
dialog[open]{display:flex;flex-direction:column}
dialog.full{width:100vw;max-width:none;height:100vh;height:100dvh;max-height:none;margin:0;border-radius:0;box-shadow:none;background:var(--bg)}
dialog.full .dh{background:var(--panel);padding:max(14px,env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:2}
dialog.full .dh h3{font-size:17px;min-width:0}
dialog.full .db{flex:1;padding:14px 14px max(24px,env(safe-area-inset-bottom))}
dialog.full .dp{max-width:760px;margin:0 auto}
dialog.full .df{padding-bottom:max(14px,env(safe-area-inset-bottom));justify-content:space-between;position:sticky;bottom:0}
dialog::backdrop{background:rgba(11,42,35,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h3{font-size:18px}
.db{padding:20px;overflow-y:auto}
.df{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;background:#fafcfb}
#toasts{position:fixed;right:16px;bottom:16px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--forest);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px;max-width:380px;display:flex;gap:10px;align-items:flex-start;animation:tin .2s ease-out}
.toast.ok{border-left:4px solid #5fd69b}.toast.err{border-left:4px solid #ff8a80}.toast.warn{border-left:4px solid var(--sun)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* ===== Tabs / misc ===== */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--leaf-d);border-bottom-color:var(--leaf)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--muted)}
.plan{border:1px solid var(--line);border-radius:var(--r-m);padding:20px;background:#fff;display:flex;flex-direction:column;gap:10px}
.plan.cur{border:2px solid var(--leaf)}
.plan .price{font-family:var(--f-d);font-size:30px;font-weight:800}
.plan .price small{font-size:14px;font-weight:500;color:var(--muted);font-family:var(--f-b)}
.plan ul{list-style:none;display:grid;gap:6px;color:var(--muted);margin:4px 0 8px}
.plan li:before{content:"✓ ";color:var(--leaf);font-weight:700}
.alert{display:flex;gap:12px;padding:12px 14px;border-radius:10px;background:var(--sun-l);color:#6f4a00;margin-bottom:16px;align-items:flex-start}
.alert.bad{background:var(--red-l);color:var(--red)}.alert.ok{background:var(--leaf-l);color:var(--leaf-d)}.alert.info{background:var(--blue-l);color:var(--blue)}
pre.code{background:var(--forest);color:#d6efe4;padding:14px;border-radius:10px;overflow:auto;font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-all}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}.chk input{margin-top:4px;accent-color:var(--leaf);width:18px;height:18px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--forest);border-color:var(--forest);color:#fff}
.skeleton{height:14px;border-radius:7px;background:linear-gradient(90deg,#e9efec,#f6f9f7,#e9efec);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:11.5px;fill:var(--muted)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.legend{flex-wrap:wrap}
.tw table tr.rtot td{font-weight:700;background:var(--bg)}
.tw table tr.rtot.rgood td:nth-child(2){color:var(--leaf-d)}
.tw table tr.rtot.rbad td:nth-child(2){color:var(--red)}
.tw table tr.rsub td{color:var(--muted)}
.rpt-note{font-size:13px;color:var(--muted);display:grid;gap:6px;margin-top:18px}
.rpt-note p{padding-left:14px;position:relative}.rpt-note p:before{content:'•';position:absolute;left:2px;color:var(--sun-d)}
.panel.pb{padding:16px 18px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-d);font-size:24px;font-weight:700}
.kpi small{color:var(--faint);font-size:12.5px}
.kpi.good .v{color:var(--leaf)}.kpi.bad .v{color:var(--red)}

/* ===== Auth ===== */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.auth-l{background:var(--forest);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-l h1{font-size:clamp(30px,3.6vw,46px);max-width:15ch;margin:28px 0 14px}
.auth-l p{color:#a9cbbd;max-width:42ch;font-size:16px}
.auth-l ul{list-style:none;display:grid;gap:10px;margin-top:26px;color:#cfe3db}
.auth-l li{display:flex;gap:10px;align-items:flex-start}.auth-l li svg{color:var(--sun);margin-top:3px}
.auth-art{position:absolute;right:-90px;bottom:-110px;width:420px;opacity:.9;pointer-events:none}
.auth-r{display:grid;place-items:center;padding:32px 20px}
.abox{width:min(420px,100%)}
.abox h2{font-size:26px;margin-bottom:6px}
.abox .tabs{margin-bottom:20px}
.abox .fld{margin-bottom:14px}
.abox .btn{width:100%}

/* ===== Dossier projet ===== */
.dp{display:grid;gap:12px}
.dp-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;display:grid;gap:10px}
.dp-card h3{font-size:15px}
.dp-card .sub,.dp-card p.sub{color:var(--muted);font-size:13px;margin:0}
.dp-head{background:var(--forest);border-color:var(--forest);color:#fff;gap:14px}
.dp-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dp-head .who{font-family:var(--f-d);font-weight:800;font-size:20px;line-height:1.15}
.dp-head .where{color:#9ec3b5;font-size:13px;margin-top:2px}
.dp-pill{padding:4px 11px;border-radius:99px;background:var(--sun);color:var(--forest);font-weight:700;font-size:12px;white-space:nowrap}
.dp-pct{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.dp-pct b{font-family:var(--f-d);font-size:34px;line-height:1}
.dp-pct span{color:#9ec3b5;font-size:13px}
.dp-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden}

/* ---------- Webhooks : signature HMAC-SHA256 (format « t=…,v1=… ») ---------- */
const enc = s => new TextEncoder().encode(s);
async function hmacHex(secret, msg) {
  const k = await crypto.subtle.importKey('raw', enc(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);

}
async function signPayload(secret, raw, t = Math.floor(Date.now() / 1000)) { return `t=${t},v1=${await hmacHex(secret, t + '.' + raw)}`; }
function safeEqual(a, b) { if (a.length !== b.length) return false; let r = 0; for (let i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i); return r === 0; }
async function verifySignature(secret, raw, header, tolerance = 300, nowSec = Math.floor(Date.now() / 1000)) {
  const m = /^t=(\d+),v1=([0-9a-f]{64})$/.exec(header || '');
  if (!m) return { ok: false, reason: 'En-tête de signature invalide' };
  if (Math.abs(nowSec - +m[1]) > tolerance) return { ok: false, reason: 'Horodatage hors tolérance (rejeu possible)' };
  const exp = await hmacHex(secret, m[1] + '.' + raw);
  return safeEqual(exp, m[2]) ? { ok: true } : { ok: false, reason: 'Signature incorrecte' };
}

const LICENSE_PUBKEY = {"kty":"EC","crv":"P-256","x":"5PCGIzGZudGqnJcWYj9ArN7EvNA5IdvDiB2TKbWeN3E","y":"4AlH8c6l4acKLgRcRZuQPcu-slrNOqd6CPOLsniJIgU"};

async function licVerify(raw) {
  let src = String(raw || '').trim();
  if (src.startsWith('{')) { try { const j = JSON.parse(src); src = String(j.code || j.licence || j.license || ''); } catch { throw new Error('Fichier de licence JSON illisible.'); } }
  const code = src.replace(/\s+/g, '');
  const m = /^SSL1\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/.exec(code);
  if (!m) throw new Error('Code de licence illisible. Copiez-le en entier, de « SSL1. » jusqu\'à la fin.');
  if (!(window.crypto && crypto.subtle)) throw new Error('Ce navigateur ne permet pas la vérification des licences.');
  let ok = false;
  try { const key = await crypto.subtle.importKey('jwk', LICENSE_PUBKEY, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']); ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, b64u.dec(m[2]), b64u.dec(m[1])); } catch { ok = false; }

  if (used.includes(p.i)) throw new Error('Ce code de licence a déjà été utilisé.');

  if (t.lic && t.lic.kind === 'vie' && p.k !== 'vie') throw new Error('Une licence à vie est déjà active sur cette installation.');

/* ---------- 3. AUTHENTIFICATION & ESPACES (multi-tenant) ---------- */
const Auth = {
  user: null, role: null, membersCount: 1,
  async hashPw(pw, salt) {
    const k = await crypto.subtle.importKey('raw', enc(pw), 'PBKDF2', false, ['deriveBits']);
    return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unhex(salt), iterations: 150000, hash: 'SHA-256' }, k, 256));
  },
  newTenant(company, ownerName) {
    return { id: 'T' + uid(), name: company, plan: 'pro', trial: true, planExpires: addDays(new Date().toISOString(), 15), webhookSecret: randomSecret(), taxRate: 18, target: 0, company: { name: company, address: '', phone: '', email: '', taxId: '' }, ownerName, createdAt: new Date().toISOString() };
  },
  validate(f, mode) {
    const e = [];
    if (mode === 'register') { if (!f.name || f.name.trim().length < 2) e.push('Indiquez votre nom'); if (!f.company || f.company.trim().length < 2) e.push('Indiquez le nom de votre entreprise'); }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email || '')) e.push('Adresse e-mail invalide');
    if (mode === 'register') passwordIssues(f.password).forEach(x => e.push('Mot de passe : ' + x));
    else if (!f.password) e.push('Saisissez votre mot de passe');
    return e;
  },
  /* -- Inscription -- */
  async register(f) {
    const email = f.email.trim().toLowerCase(), name = f.name.trim();
    if (Cloud.on) {
      const { Au, Fs, db, auth } = Cloud.fb;
      let cred; try { cred = await Au.createUserWithEmailAndPassword(auth, email, f.password); } catch (e) { throw new Error(this.fbMsg(e)); }
      const inv = await Fs.getDoc(Fs.doc(db, 'invites', email));
      let tid, role;
      if (inv.exists()) { tid = inv.data().tid; role = inv.data().role; }
      else {
        const t = this.newTenant(f.company.trim(), name); delete t.webhookSecret; t.id = 'T' + cred.user.uid.slice(0, 10); tid = t.id; role = 'owner';
        const { id, ...rest } = t; rest.ownerId = cred.user.uid;
        await Fs.setDoc(Fs.doc(db, 'tenants', tid), rest);
      }
      await Fs.setDoc(Fs.doc(db, 'users', cred.user.uid), { name, email, tid, role, createdAt: new Date().toISOString() });
      if (inv.exists()) await Fs.deleteDoc(Fs.doc(db, 'invites', email)).catch(() => { });
      this.user = { id: cred.user.uid, email, name, tid }; this.role = role; return;
    }
    const users = LS.get('ss_users', []);
    if (users.some(u => u.email === email)) throw new Error('Un compte existe déjà avec cet e-mail');
    const invites = LS.get('ss_invites', {}); let tid, role;
    if (invites[email]) { tid = invites[email].tid; role = invites[email].role; delete invites[email]; LS.set('ss_invites', invites); }
    else { const t = this.newTenant(f.company.trim(), name); const all = LS.get('ss_tenants', []); all.push(t); LS.set('ss_tenants', all); tid = t.id; role = 'owner'; }
    const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
    const u = { id: uid('U'), email, name, salt, hash: await this.hashPw(f.password, salt), tid, role, createdAt: new Date().toISOString() };
    users.push(u); LS.set('ss_users', users); this.setSession(u);
  },
  /* -- Connexion (limitation des tentatives : 5 essais puis 60 s) -- */
  async login(f) {
    const email = f.email.trim().toLowerCase();
    const lk = 'ss_lock_' + email, lock = LS.get(lk, { n: 0, until: 0 });
    if (lock.until > Date.now()) throw new Error(`Trop de tentatives. Réessayez dans ${Math.ceil((lock.until - Date.now()) / 1000)} s.`);
    const fail = msg => { lock.n++; if (lock.n >= 5) { lock.until = Date.now() + 60000; lock.n = 0; } LS.set(lk, lock); throw new Error(msg); };
    if (Cloud.on) {
      const { Au, Fs, db, auth } = Cloud.fb;
      let cred; try { cred = await Au.signInWithEmailAndPassword(auth, email, f.password); } catch (e) { return fail(this.fbMsg(e)); }
      await this.loadProfile(cred.user); LS.del(lk); return;
    }
    const u = LS.get('ss_users', []).find(x => x.email === email);
    if (!u || u.hash !== await this.hashPw(f.password, u.salt)) return fail('E-mail ou mot de passe incorrect');
    LS.del(lk); this.setSession(u);
  },
  async loadProfile(fu) {
    const { Fs, db } = Cloud.fb;
    const p = await Fs.getDoc(Fs.doc(db, 'users', fu.uid));
    if (!p.exists()) { await Cloud.fb.Au.signOut(Cloud.fb.auth); throw new Error('Ce compte n\'est rattaché à aucun espace. Demandez une invitation à votre administrateur.'); }
    const d = p.data(); this.user = { id: fu.uid, email: d.email, name: d.name, tid: d.tid }; this.role = d.role;
  },
  setSession(u) { this.user = { id: u.id, email: u.email, name: u.name, tid: u.tid }; this.role = u.role; LS.set('ss_session', { uid: u.id, at: Date.now() }); },
  async restore() {
    if (Cloud.on) {
      const { auth } = Cloud.fb;
      const fu = await new Promise(res => { const off = auth.onAuthStateChanged(u => { off(); res(u); }); });
      if (!fu) return false; try { await this.loadProfile(fu); return true; } catch { return false; }
    }
    const s = LS.get('ss_session'); if (!s) return false;
    if (Date.now() - s.at > 7 * 864e5) { LS.del('ss_session'); return false; }
    const u = LS.get('ss_users', []).find(x => x.id === s.uid); if (!u) return false;
    this.user = { id: u.id, email: u.email, name: u.name, tid: u.tid }; this.role = u.role; return true;
  },
  async logout() { if (Cloud.on) await Cloud.fb.Au.signOut(Cloud.fb.auth); LS.del('ss_session'); this.user = null; this.role = null; },
  async resetPassword(email) {
    if (!Cloud.on) throw new Error('En mode local, demandez à un administrateur de réinitialiser votre mot de passe (page Équipe).');
    try { await Cloud.fb.Au.sendPasswordResetEmail(Cloud.fb.auth, email.trim()); } catch (e) { throw new Error(this.fbMsg(e)); }
  },
  fbMsg(e) {
    const m = { 'auth/email-already-in-use': 'Un compte existe déjà avec cet e-mail', 'auth/invalid-credential': 'E-mail ou mot de passe incorrect', 'auth/wrong-password': 'E-mail ou mot de passe incorrect', 'auth/user-not-found': 'E-mail ou mot de passe incorrect', 'auth/too-many-requests': 'Trop de tentatives. Réessayez plus tard.', 'auth/weak-password': 'Mot de passe trop faible', 'auth/network-request-failed': 'Réseau indisponible' };
    return m[e.code] || ('Erreur d\'authentification : ' + (e.code || e.message));
  },
  /* -- Équipe -- */
  async members() {
    let list;
    if (Cloud.on) { const { Fs, db } = Cloud.fb; const s = await Fs.getDocs(Fs.query(Fs.collection(db, 'users'), Fs.where('tid', '==', Store.tid))); list = s.docs.map(d => ({ id: d.id, ...d.data() })); }
    else list = LS.get('ss_users', []).filter(u => u.tid === Store.tid).map(({ id, name, email, role, createdAt }) => ({ id, name, email, role, createdAt }));
    this.membersCount = list.length; return list;
  },
  async invitations() {
    if (Cloud.on) return [];
    const inv = LS.get('ss_invites', {}); return Object.entries(inv).filter(([, v]) => v.tid === Store.tid).map(([email, v]) => ({ email, role: v.role }));
  },
  async invite(email, role) {
    email = email.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('Adresse e-mail invalide');
    if (!ROLES[role] || role === 'owner') throw new Error('Rôle invalide');
    if (Cloud.on) { const { Fs, db } = Cloud.fb; await Fs.setDoc(Fs.doc(db, 'invites', email), { tid: Store.tid, role, by: Auth.user.id }); }
    else { const inv = LS.get('ss_invites', {}); inv[email] = { tid: Store.tid, role }; LS.set('ss_invites', inv); }
  },
  async setRole(uidv, role) {
    if (!ROLES[role] || role === 'owner') throw new Error('Rôle invalide');
    if (Cloud.on) { const { Fs, db } = Cloud.fb; await Fs.updateDoc(Fs.doc(db, 'users', uidv), { role }); }
    else { const us = LS.get('ss_users', []); const u = us.find(x => x.id === uidv); if (u && u.role !== 'owner') u.role = role; LS.set('ss_users', us); }
  },
  async removeMember(uidv) {
    if (Cloud.on) { const { Fs, db } = Cloud.fb; await Fs.deleteDoc(Fs.doc(db, 'users', uidv)); }
    else LS.set('ss_users', LS.get('ss_users', []).filter(u => !(u.id === uidv && u.role !== 'owner')));
  },
  async tempPassword(uidv) {
    if (Cloud.on) throw new Error('En mode cloud, le membre utilise « Mot de passe oublié » (e-mail de réinitialisation).');
    const pw = 'Tmp' + hex(crypto.getRandomValues(new Uint8Array(4))) + '9';
    const us = LS.get('ss_users', []); const u = us.find(x => x.id === uidv); if (!u) throw new Error('Membre introuvable');
    u.salt = hex(crypto.getRandomValues(new Uint8Array(16))); u.hash = await this.hashPw(pw, u.salt); LS.set('ss_users', us); return pw;
  }
};

function fieldHTML(f, v) {

  else if (f.type === 'image') inner = `<div class="imgfld"><div class="imgpv" id="pv_${f.k}">${val ? `<img src="${esc(val)}" alt="">` : ic('box')}</div><div class="row"><label class="btn btn-o btn-sm" style="cursor:pointer">${ic('up')}Choisir une image<input type="file" accept="image/*" class="sr" data-change="img-pick" data-k="${f.k}" data-px="${f.px || 400}" data-fmt="${f.fmt || 'jpeg'}"></label><button type="button" class="btn btn-g btn-sm" data-act="img-clear" data-k="${f.k}">Retirer</button></div><input type="hidden" id="${id}" name="${f.k}" value="${esc(val)}"></div>`;
  else if (f.type === 'textarea') inner = `<textarea id="${id}" name="${f.k}" placeholder="${esc(f.ph || '')}">${esc(val)}</textarea>`;
  else inner = `<input id="${id}" name="${f.k}" type="${f.type || 'text'}" value="${esc(val)}" placeholder="${esc(f.ph || '')}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${f.step ? `step="${f.step}"` : ''} ${f.type === 'tel' ? 'inputmode="tel"' : ''} ${f.type === 'number' ? 'inputmode="decimal"' : ''} autocomplete="off">`;
  return `<div class="fld ${f.full ? 'full' : ''}"><label for="${id}">${esc(f.l)}${f.req ? ' *' : ''}</label>${inner}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}</div>`;
}
function readFields(form, fields) {
  const out = {}, errs = [];
  fields.forEach(f => {
    const el = form.elements[f.k]; if (!el) return;
    let v = el.value.trim();
    if (f.type === 'number') v = v === '' ? '' : +v.replace(',', '.');
    if (f.req && (v === '' || Number.isNaN(v))) errs.push(`${f.l} obligatoire`);
    else if (v !== '') {
      if (f.type === 'number') { if (Number.isNaN(v)) errs.push(`${f.l} doit être un nombre`); else { if (f.min != null && v < f.min) errs.push(`${f.l} ≥ ${f.min}`); if (f.max != null && v > f.max) errs.push(`${f.l} ≤ ${f.max}`); } }
      if (f.type === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) errs.push(`${f.l} invalide`);
      if (f.type === 'tel' && !/^[+\d][\d\s().-]{5,}$/.test(v)) errs.push(`${f.l} invalide`);
    }
    out[f.k] = v;
  });
  return { values: out, errors: errs };
}

/* Graphique en barres SVG (sans dépendance) */
function barChart(labels, series) {
  const W = 600, H = 230, pl = 46, pb = 28, pt = 10, max = Math.max(1, ...series.flatMap(s => s.values)) * 1.1;
  const gw = (W - pl) / labels.length, bw = Math.min(26, gw / (series.length + 1));
  const nice = v => v >= 1e6 ? fmtN(v / 1e6, 1) + ' M' : v >= 1e3 ? fmtN(v / 1e3, 0) + ' k' : fmtN(v, 0);
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = pt + (H - pt - pb) * (1 - i / 4); g += `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#e4ebe7"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end">${nice(max * i / 4)}</text>`; }
  labels.forEach((l, i) => {
    const x0 = pl + i * gw + (gw - bw * series.length - 4 * (series.length - 1)) / 2;
    series.forEach((s, j) => { const h = (H - pt - pb) * s.values[i] / max; g += `<rect x="${x0 + j * (bw + 4)}" y="${H - pb - h}" width="${bw}" height="${Math.max(h, 0)}" rx="4" fill="${s.color}"><title>${esc(s.name)} : ${fmt(s.values[i])}</title></rect>`; });
    g += `<text x="${pl + i * gw + gw / 2}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique : ${series.map(s => s.name).join(' et ')} sur ${labels.length} mois">${g}</svg>`;
}

});

const LST = {};
const PAGE_SIZE = 12;
function entRender(key, root) {
  const E = ENT[key], st = LST[key] || (LST[key] = { q: '', sort: E.sort || null, page: 1, f: '' });
  if (window.__pendingQ) { st.q = window.__pendingQ; window.__pendingQ = ''; }
  const w = can(E.res, 'w');
  root.innerHTML = pageHead(E.label, E.sub, `<button class="btn btn-o" data-act="ent-csv" data-e="${key}">${ic('down')}Exporter CSV</button>${w ? `<button class="btn btn-p" data-act="ent-new" data-e="${key}">${ic('plus')}Ajouter un ${E.one}</button>` : ''}`) +
    `<div class="panel"><div class="tools"><input type="search" placeholder="Rechercher…" aria-label="Rechercher" value="${esc(st.q)}" data-input="ent-q" data-e="${key}">${E.filter ? `<select data-change="ent-f" data-e="${key}" aria-label="Filtrer"><option value="">${esc(E.filter.all)}</option>${E.filter.opts.map(o => `<option ${st.f === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>` : ''}</div><div id="entbody"></div></div>`;
  entDraw(key);
}
function entRows(key) {
  const E = ENT[key], st = LST[key]; let rows = Store.all(key);
  if (st.f) rows = rows.filter(r => r[E.filter.k] === st.f);
  if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter(r => E.search.some(k => String(r[k] ?? '').toLowerCase().includes(q)) || (['projects', 'interventions', 'contracts'].includes(key)) && clientName(r.clientId).toLowerCase().includes(q)); }
  const s = st.sort;
  if (s) { const col = typeof s.k === 'number' ? E.cols[s.k] : null; rows = rows.slice().sort((a, b) => { const va = col && col.s ? col.s(a) : a[s.k], vb = col && col.s ? col.s(b) : b[s.k]; return (va > vb ? 1 : va < vb ? -1 : 0) * s.dir; }); }
  else rows = rows.slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  return rows;
}
function entDraw(key) {
  const E = ENT[key], st = LST[key], box = $('#entbody'); if (!box) return;
  const rows = entRows(key), pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE)); st.page = Math.min(st.page, pages);
  const slice = rows.slice((st.page - 1) * PAGE_SIZE, st.page * PAGE_SIZE), w = can(E.res, 'w');
  if (!rows.length) { box.innerHTML = Store.all(key).length ? empty('search', 'Aucun résultat', 'Modifiez votre recherche ou vos filtres.') : empty(E.icon, `Aucun ${E.one} pour le moment`, `Ajoutez votre premier ${E.one} pour commencer.`, w ? `<button class="btn btn-p" data-act="ent-new" data-e="${key}">${ic('plus')}Ajouter un ${E.one}</button>` : ''); return; }
  box.innerHTML = `<div class="tw"><table><thead><tr>${E.cols.map((c, i) => `<th class="${c.num ? 'num' : ''}" ${c.s ? `data-sort="${i}" data-act="ent-sort" data-e="${key}" aria-sort="${st.sort && st.sort.k === i ? (st.sort.dir > 0 ? 'ascending' : 'descending') : 'none'}"` : ''}>${esc(c.l)}${st.sort && st.sort.k === i ? (st.sort.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('')}<th></th></tr></thead><tbody>${slice.map(r => `<tr>${E.cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.v(r)}</td>`).join('')}<td class="right" style="white-space:nowrap">${E.extra ? E.extra(r) : ''}${w ? `<button class="btn-ic" data-act="ent-edit" data-e="${key}" data-id="${r.id}" aria-label="Modifier">${ic('edit')}</button><button class="btn-ic del" data-act="ent-del" data-e="${key}" data-id="${r.id}" aria-label="Supprimer">${ic('trash')}</button>` : ''}</td></tr>`).join('')}</tbody></table></div><div class="pager"><span>${rows.length} ${E.one}${rows.length > 1 ? 's' : ''}</span><span class="row"><button class="btn btn-o btn-sm" data-act="ent-page" data-e="${key}" data-d="-1" ${st.page <= 1 ? 'disabled' : ''}>Précédent</button><span>Page ${st.page} / ${pages}</span><button class="btn btn-o btn-sm" data-act="ent-page" data-e="${key}" data-d="1" ${st.page >= pages ? 'disabled' : ''}>Suivant</button></span></div>`;
}
ON_INPUT['ent-q'] = debounce((el) => { const st = LST[el.dataset.e]; st.q = el.value; st.page = 1; entDraw(el.dataset.e); }, 180);
ON_INPUT['ent-f'] = el => { const st = LST[el.dataset.e]; st.f = el.value; st.page = 1; entDraw(el.dataset.e); };
ACT['ent-sort'] = d => { const st = LST[d.e], k = +d.sort; st.sort = st.sort && st.sort.k === k ? { k, dir: -st.sort.dir } : { k, dir: 1 }; entDraw(d.e); };
ACT['ent-page'] = d => { LST[d.e].page += +d.d; entDraw(d.e); };
ACT['ent-csv'] = d => {
  const E = ENT[d.e], rows = entRows(d.e);
  const head = E.fields.map(f => f.l), body = rows.map(r => E.fields.map(f => lookup(f, r[f.k])));
  download(`${d.e}-${today()}.csv`, '\ufeff' + [head, ...body].map(r => r.map(csvCell).join(';')).join('\n'), 'text/csv');
  toast(`${rows.length} ligne(s) exportée(s)`);
};
function entForm(key, id) {
  const E = ENT[key], cur = id ? Store.byId(key, id) : null;
  const fields = E.fields.filter(f => !(f.onlyNew && cur));
  openDialog(cur ? `Modifier ${E.one}` : `Nouveau ${E.one}`, `<form data-form="ent-save" data-e="${key}" data-id="${id || ''}" id="entform"><div class="ferr" role="alert"></div><div class="fg">${fields.map(f => fieldHTML(f, cur ? cur[f.k] : undefined)).join('')}</div></form>`, { footer: `<button class="btn btn-o" data-act="dlg-close">Annuler</button><button class="btn btn-p" type="submit" form="entform">Enregistrer</button>` });
}
ACT['ent-new'] = d => { const E = ENT[d.e]; if (!can(E.res, 'w')) return toast('Accès en lecture seule pour votre rôle', 'warn'); if (E.limit && !checkLimit(E.limit)) return; entForm(d.e); };
ACT['ent-edit'] = d => { if (!can(ENT[d.e].res, 'w')) return; entForm(d.e, d.id); };
ACT['ent-del'] = async d => {
  const E = ENT[d.e]; if (!can(E.res, 'w')) return; const r = Store.byId(d.e, d.id); if (!r) return;
  const msg = E.canDelete && E.canDelete(r); if (msg) return toast(msg, 'warn');
  if (!await ask(`Supprimer ce ${E.one} ?`, 'Cette action est enregistrée dans le journal.', 'Supprimer')) return;
  await Store.remove(d.e, d.id); log(`Suppression ${E.one} : ${r.name || r.label || r.type || r.id}`); toast('Supprimé'); entDraw(d.e);
};
ON_SUBMIT['ent-save'] = async f => {
  const key = f.dataset.e, id = f.dataset.id, E = ENT[key];
  if (!can(E.res, 'w')) throw new Error('Accès refusé');
  const fields = E.fields.filter(x => !(x.onlyNew && id)), { values, errors } = readFields(f, fields);
  if (errors.length) return showErr(f, errors);
  const cur = id ? Store.byId(key, id) : null;
  const o = { ...(cur || { id: uid(E.prefix) }), ...values };
  if (f.dataset.projectId) o.projectId = f.dataset.projectId;
  if (key === 'contracts') { if (values.endDate < values.startDate) return showErr(f, ['La date de fin doit être après la date de début']); if (!cur) o.ref = docNumber(Store.cache.contracts.map(x => x.ref || ''), 'CT', new Date(values.startDate + 'T12:00:00').getFullYear()); }
  if (key === 'products') { if (!cur) { o.stock = 0; } if (Store.all('products').some(p => p.id !== o.id && p.ref.toLowerCase() === String(o.ref).toLowerCase())) return showErr(f, ['Cette référence existe déjà']); }
  await Store.save(key, o);
  if (key === 'products' && !cur && +values.stock > 0) await moveStock(o.id, +values.stock, 'in', 'Stock initial', o.id);
  log(`${cur ? 'Modification' : 'Création'} ${E.one} : ${o.name || o.label || o.type}`);
  closeDialog(); toast(cur ? 'Modifications enregistrées' : `${E.one[0].toUpperCase() + E.one.slice(1)} ajouté`); entDraw(key);
};

/* ===== Parcours automatique : les étapes du projet s'enchaînent seules =====
   Étude validée → devis → (accepté) chantier planifié + technicien → chantier terminé → facture + contrat → payée = clôturé.
   Idempotent : relancé après chaque enregistrement lié au projet, il ne fait que l'étape due. Jamais d'envoi au client ni de commande fournisseur automatiques. */
const AUTO_STEPS = [
  ['studied', 'Étude validée', 'Validez l’étude : le devis et les demandes d’achat sont préparés automatiquement.'],
  ['quoted', 'Devis envoyé', 'Passez le devis à « Envoyé » : le projet passe en « Devis envoyé ».'],
  ['accepted', 'Devis accepté', 'Quand le devis passe à « Accepté », le chantier est planifié et un technicien est affecté automatiquement.'],

function drawQuotes() {

async function syncStock(oldLines, newLines, ref) {
  const net = {};
  (newLines || []).forEach(l => { if (l.pid) net[l.pid] = (net[l.pid] || 0) + l.qty; });
  (oldLines || []).forEach(l => { if (l.pid) net[l.pid] = (net[l.pid] || 0) - l.qty; });
  for (const [pid, delta] of Object.entries(net)) {
    if (!delta) continue;
    await moveStock(pid, Math.abs(delta), delta > 0 ? 'out' : 'in', delta > 0 ? 'Vente ' + ref : 'Ajustement ' + ref, ref);
    const p = Store.byId('products', pid); if (p && p.stock < 0) toast(`Stock négatif pour « ${p.name} » : pensez à réapprovisionner.`, 'warn');
  }
}
ON_SUBMIT['q-save'] = async f => {
  if (!can('quotes', 'w')) throw new Error('Accès refusé');
  const id = f.dataset.id, type = f.dataset.type, cur = id ? Store.byId('quotes', id) : null, errs = [];
  const lines = readLines(f).map(l => ({ ...l, desc: l.desc || (Store.byId('products', l.pid) || {}).name || '' }));
  const v = Object.fromEntries(new FormData(f));
  if (!v.clientId) errs.push('Choisissez un client');
  if (!v.date) errs.push('La date est obligatoire');
  if (!lines.length) errs.push('Ajoutez au moins une ligne');
  lines.forEach((l, i) => { if (!l.desc) errs.push(`Ligne ${i + 1} : désignation manquante`); if (!(l.qty > 0)) errs.push(`Ligne ${i + 1} : quantité > 0`); if (l.price < 0) errs.push(`Ligne ${i + 1} : prix négatif`); });
  const disc = +v.discount || 0; if (disc < 0 || disc > 100) errs.push('La remise doit être entre 0 et 100 %');
  const o = { ...(cur || { id: docNumber(Store.all('quotes').map(x => x.id).concat(Store.cache.quotes.map(x => x.id)), type === 'facture' ? 'FA' : 'DV', new Date(v.date || today()).getFullYear()), type, payments: [], taxRate: taxRate() }), clientId: v.clientId, date: v.date, dueDate: v.dueDate || '', discount: disc, vat: !!v.vat, notes: v.notes || '', lines };
  if (type === 'devis') o.status = v.status || 'Brouillon';
  if (type === 'facture' && qT(o).total < paidOf(o) - 0.5) errs.push('Le total ne peut pas être inférieur aux paiements déjà reçus');
  if (errs.length) return showErr(f, errs);
  await Store.save('quotes', o);
  if (type === 'facture') await syncStock(cur ? cur.lines : [], lines, o.id);
  log(`${cur ? 'Modification' : 'Création'} ${type} ${o.id}`); closeDialog(); toast(`${o.id} enregistré`); if ($('#qbody')) drawQuotes();
};

function lastMonths(n) {
  const out = []; for (let i = n - 1; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`); } return out;
}
const invoices = () => Store.all('quotes').filter(q => q.type === 'facture');
const allPayments = () => invoices().flatMap(q => (q.payments || []).map(p => ({ ...p, inv: q.id, clientId: q.clientId })));

/* ---------- Bénéfice & rapports ---------- */
/* Bénéfice brut = ventes HT − coût d'achat des produits vendus. Bénéfice net = bénéfice brut − dépenses d'exploitation.
   La catégorie de dépenses « Achat matériel » est exclue du net : le coût des produits vendus est déjà compté dans le coût d'achat. */
const costSnap = pid => { const p = pid ? Store.byId('products', pid) : null; return p ? (+p.cost || 0) : ''; };
const lineHasCost = l => (l.cost != null && l.cost !== '') || !!(l.pid && Store.byId('products', l.pid));
const lineCost = l => {
  const u = (l.cost != null && l.cost !== '') ? +l.cost : (l.pid && Store.byId('products', l.pid) ? (+Store.byId('products', l.pid).cost || 0) : 0);
  return (u || 0) * (+l.qty || 0);
};
const OPEX_SKIP = 'Achat matériel';
const isOpex = e => e.category !== OPEX_SKIP;
function profitOf(invs, exps) {
  const sales = sum(invs, q => qT(q).net), cogs = sum(invs, q => sum(q.lines || [], lineCost)), gross = sales - cogs;
  const opex = sum(exps.filter(isOpex), e => +e.amount), bought = sum(exps.filter(e => !isOpex(e)), e => +e.amount), net = gross - opex;
  return { sales, cogs, gross, grossPct: sales > 0 ? gross / sales * 100 : 0, opex, bought, net, netPct: sales > 0 ? net / sales * 100 : 0 };
}
const pct = v => fmtN(v, 1) + ' %';
const signF = v => (v < 0 ? '− ' : '') + fmt(Math.abs(v));

const RPT = { period: 'year' };
const RPT_PERIODS = [['month', 'Ce mois', 'Ce mois-ci'], ['3m', '3 mois', '3 derniers mois'], ['year', 'Cette année', 'Année en cours'], ['12m', '12 mois', '12 derniers mois'], ['all', 'Tout', 'Depuis le début']];
const periodLong = k => (RPT_PERIODS.find(p => p[0] === k) || RPT_PERIODS[2])[2];
function periodTest(k) {
  const t = today(), m3 = lastMonths(3)[0], m12 = lastMonths(12)[0];
  return d => { d = String(d || ''); return k === 'all' ? true : k === 'month' ? ym(d) === t.slice(0, 7) : k === '3m' ? ym(d) >= m3 : k === 'year' ? d.slice(0, 4) === t.slice(0, 4) : ym(d) >= m12; };
}

/* Graphiques SVG autonomes (attributs en ligne : fonctionnent aussi dans la fenêtre d'impression) */
const CH_FONT = `font-family="Instrument Sans,Segoe UI,Arial,sans-serif" font-size="11" fill="#5d6f68"`;
const niceN = v => { const a = Math.abs(v), t = a >= 1e6 ? fmtN(a / 1e6, 1) + ' M' : a >= 1e3 ? fmtN(a / 1e3, 0) + ' k' : fmtN(a, 0); return (v < 0 ? '− ' : '') + t; };
function chartScale(values, H, pt, pb) {
  let hi = Math.max(0, ...values), lo = Math.min(0, ...values); if (hi > 0) hi *= 1.1; if (lo < 0) lo *= 1.1; if (hi === lo) hi = 1;
  const y = v => pt + (H - pt - pb) * (hi - v) / (hi - lo);
  const grid = (W, pl) => { let g = ''; for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4, yy = y(v); g += `<line x1="${pl}" x2="${W}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="#e4ebe7"/><text ${CH_FONT} x="${pl - 6}" y="${(yy + 4).toFixed(1)}" text-anchor="end">${niceN(v)}</text>`; } return g + `<line x1="${pl}" x2="${W}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="#9db0a8"/>`; };
  return { y, grid };
}
function signedBars(labels, series) {
  const W = 640, H = 250, pl = 52, pb = 28, pt = 12, sc = chartScale(series.flatMap(s => s.values), H, pt, pb);
  const gw = (W - pl - 4) / labels.length, bw = Math.min(16, gw / (series.length + 1)), gap = 2;
  let g = sc.grid(W, pl);
  labels.forEach((l, i) => {
    const x0 = pl + i * gw + (gw - bw * series.length - gap * (series.length - 1)) / 2;
    series.forEach((s, j) => { const v = s.values[i], y0 = sc.y(0), y1 = sc.y(v), top = Math.min(y0, y1), h = Math.abs(y1 - y0); g += `<rect x="${(x0 + j * (bw + gap)).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h, v ? 1 : 0).toFixed(1)}" rx="3" fill="${s.color}"><title>${esc(s.name)} · ${esc(l)} : ${signF(v)}</title></rect>`; });
    g += `<text ${CH_FONT} x="${(pl + i * gw + gw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;height:auto" role="img" aria-label="Graphique : ${esc(series.map(s => s.name).join(', '))} sur ${labels.length} mois">${g}</svg>`;
}
function lineChart(labels, values, color, name) {
  const W = 440, H = 240, pl = 48, pb = 28, pt = 12, sc = chartScale(values, H, pt, pb), gw = (W - pl - 10) / labels.length;
  const X = i => pl + i * gw + gw / 2; let g = sc.grid(W, pl);
  const pts = values.map((v, i) => `${X(i).toFixed(1)},${sc.y(v).toFixed(1)}`).join(' ');
  g += `<polygon points="${X(0).toFixed(1)},${sc.y(0).toFixed(1)} ${pts} ${X(values.length - 1).toFixed(1)},${sc.y(0).toFixed(1)}" fill="${color}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  values.forEach((v, i) => { g += `<circle cx="${X(i).toFixed(1)}" cy="${sc.y(v).toFixed(1)}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"><title>${esc(name)} · ${esc(labels[i])} : ${signF(v)}</title></circle><text ${CH_FONT} x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(labels[i])}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;height:auto" role="img" aria-label="Courbe : ${esc(name)} sur ${labels.length} mois">${g}</svg>`;
}
const DONUT_COLORS = ['#0f7b5f', '#ffb000', '#2a62c4', '#c63a3a', '#7a5af8', '#12a8a8', '#8a9b94'];
function donut(items, centerLabel) {
  const total = sum(items, i => i.v); if (total <= 0) return '<p style="color:#5d6f68">Aucune dépense sur la période.</p>';
  let acc = 0, segs = '';
  items.forEach((it, i) => { const p = it.v / total * 100; segs += `<circle cx="80" cy="80" r="60" fill="none" stroke="${DONUT_COLORS[i % DONUT_COLORS.length]}" stroke-width="26" pathLength="100" stroke-dasharray="${p.toFixed(2)} ${(100 - p).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 80 80)"><title>${esc(it.l)} : ${fmt(it.v)} (${fmtN(p, 0)} %)</title></circle>`; acc += p; });
  const svg = `<svg viewBox="0 0 160 160" width="170" height="170" style="flex-shrink:0" role="img" aria-label="Répartition des dépenses par catégorie">${segs}<text x="80" y="76" text-anchor="middle" font-family="Instrument Sans,Segoe UI,Arial,sans-serif" font-size="10" fill="#5d6f68">${esc(centerLabel)}</text><text x="80" y="94" text-anchor="middle" font-family="Instrument Sans,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#12211c">${niceN(total)} F</text></svg>`;
  const leg = items.map((it, i) => `<li style="display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 0;font-size:13px"><span style="display:flex;gap:8px;align-items:center"><i style="width:10px;height:10px;border-radius:3px;background:${DONUT_COLORS[i % DONUT_COLORS.length]};display:inline-block"></i>${esc(it.l)}</span><b>${fmt(it.v)} <span style="color:#8a9b94;font-weight:500">· ${fmtN(it.v / total * 100, 0)} %</span></b></li>`).join('');
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">${svg}<ul style="list-style:none;flex:1;min-width:180px;margin:0;padding:0">${leg}</ul></div>`;
}
function hbars(items) {
  const mx = Math.max(1, ...items.map(i => Math.abs(i.v)));
  return items.map(i => `<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;gap:10px;font-size:13px"><span>${esc(i.l)}</span><b style="color:${i.v < 0 ? '#c63a3a' : '#12211c'}">${signF(i.v)}</b></div><div style="height:7px;background:#e8eeea;border-radius:9px;overflow:hidden;margin-top:4px"><i style="display:block;height:100%;width:${(Math.abs(i.v) / mx * 100).toFixed(1)}%;background:${i.v < 0 ? '#c63a3a' : '#0f7b5f'};border-radius:9px"></i></div></div>`).join('');

function reportData(k) {
  const test = periodTest(k), allInv = invoices(), allExp = Store.all('expenses');
  const invs = allInv.filter(q => test(q.date)), exps = allExp.filter(e => test(e.date)), pays = allPayments().filter(p => test(p.date));
  const P = profitOf(invs, exps), cash = sum(pays, p => +p.amount), unpaid = sum(invs, q => Math.max(0, qT(q).total - paidOf(q)));
  let run = 0;
  const months = lastMonths(12).map(m => { const r = profitOf(allInv.filter(q => ym(q.date) === m), allExp.filter(e => ym(e.date) === m)); run += r.net; return { m, label: monthLabel(m), ...r, cum: run }; });
  const byCat = {}; exps.forEach(e => byCat[e.category || 'Autre'] = (byCat[e.category || 'Autre'] || 0) + +e.amount);
  const cats = Object.entries(byCat).map(([l, v]) => ({ l, v, skip: l === OPEX_SKIP })).sort((a, b) => b.v - a.v);
  const prod = {}; let freeLines = 0;
  invs.forEach(q => { const f = 1 - (+q.discount || 0) / 100; (q.lines || []).forEach(l => { const key = l.pid || ('~' + (l.desc || '')), has = lineHasCost(l); if (!has) freeLines++; const o = prod[key] || (prod[key] = { name: l.desc || '—', qty: 0, sales: 0, cogs: 0, nocost: !has }); const qty = +l.qty || 0; o.qty += qty; o.sales += qty * (+l.price || 0) * f; o.cogs += lineCost(l); }); });
  const prods = Object.values(prod).map(o => ({ ...o, profit: o.sales - o.cogs, margin: o.sales > 0 ? (o.sales - o.cogs) / o.sales * 100 : 0 })).sort((a, b) => b.profit - a.profit);
  const cli = {}; invs.forEach(q => { const o = cli[q.clientId || ''] || (cli[q.clientId || ''] = { name: clientName(q.clientId), n: 0, sales: 0, gross: 0 }); const r = profitOf([q], []); o.n++; o.sales += r.sales; o.gross += r.gross; });
  const clients = Object.values(cli).sort((a, b) => b.gross - a.gross);
  return { P, cash, unpaid, months, cats, prods, clients, nInv: invs.length, nExp: exps.length, freeLines };
}
const tbl = (head, rows, opts = {}) => `<table><thead><tr>${head.map((h, i) => `<th${i > 0 && !opts.left ? ' class="num"' : ''}>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
const tr = (cells, cls = '') => `<tr${cls ? ` class="${cls}"` : ''}>${cells.map((c, i) => `<td${i > 0 ? ' class="num"' : ''}>${c}</td>`).join('')}</tr>`;
function plTable(d) {

function getAlerts() {
  const out = [], low = Store.all('products').filter(p => p.stock <= p.minStock);
  if (low.length) out.push({ t: 'warn', i: 'box', page: 'stock', x: `${low.length} produit${low.length > 1 ? 's' : ''} sous le seuil d'alerte` });
  const od = invoices().filter(q => qS(q).l === 'En retard');
  if (od.length) out.push({ t: 'bad', i: 'alert', page: 'quotes', x: `${od.length} facture${od.length > 1 ? 's' : ''} en retard : ${fmt(sum(od, q => qT(q).total - paidOf(q)))} à relancer` });
  const soon = Store.all('interventions').filter(i => ['Planifiée', 'En cours'].includes(i.status) && i.date >= today() && i.date <= daysAgo(-3));
  if (soon.length) out.push({ t: 'ok', i: 'tool', page: 'interventions', x: `${soon.length} intervention${soon.length > 1 ? 's' : ''} dans les 3 prochains jours` });
  const cts = Store.all('contracts').filter(c => c.status === 'Actif' && c.endDate >= today() && c.endDate <= daysAgo(-30));
  if (cts.length) out.push({ t: 'warn', i: 'shield', page: 'contracts', x: `${cts.length} contrat${cts.length > 1 ? 's' : ''} à renouveler sous 30 jours` });
  const rdv = Store.all('appointments').filter(a => ['Planifié', 'Confirmé'].includes(a.status) && a.date >= today() && a.date <= daysAgo(-1));
  if (rdv.length) out.push({ t: 'ok', i: 'cal', page: 'planning', x: `${rdv.length} rendez-vous aujourd'hui ou demain` });
  if (Store.all('inventories').some(x => x.status === 'En cours')) out.push({ t: 'warn', i: 'clipboard', page: 'stock', x: 'Un inventaire est en cours : pensez à le valider' });
  const t = Store.tenant;
  if (t) {
    const days = t.planExpires ? Math.ceil((new Date(t.planExpires) - trustedNow()) / 864e5) : null;
    if (t.plan !== 'free' && days != null && days <= 0) out.push({ t: 'bad', i: 'card', page: 'billing', x: 'Votre abonnement a expiré : retour au plan Découverte' });
    else if (t.plan !== 'free' && days != null && days <= 7) out.push({ t: 'warn', i: 'card', page: 'billing', x: `${t.trial ? 'Essai Pro' : 'Abonnement'} : ${days} jour${days > 1 ? 's' : ''} restant${days > 1 ? 's' : ''}` });
  }
  return out;
}

function sunArc(v, t) {
  const p = t > 0 ? Math.min(1, v / t) : 0, th = Math.PI * (1 - p), x = 160 + 140 * Math.cos(th), y = 160 - 140 * Math.sin(th);
  let rays = ''; for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, c = Math.cos(a), s = Math.sin(a); rays += `<line x1="${(x + 17 * c).toFixed(1)}" y1="${(y + 17 * s).toFixed(1)}" x2="${(x + 23 * c).toFixed(1)}" y2="${(y + 23 * s).toFixed(1)}"/>`; }
  const arc = 'M20 160A140 140 0 0 1 300 160';
  return `<svg class="arc" viewBox="0 0 320 190" role="img" aria-label="${t ? Math.round(p * 100) + ' % de l\'objectif mensuel atteint' : 'Aucun objectif défini'}"><path d="${arc}" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="14" stroke-linecap="round"/><path d="${arc}" pathLength="100" fill="none" stroke="#ffb000" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(p * 100).toFixed(1)} 100"/><g stroke="#ffb000" stroke-width="2.5" stroke-linecap="round">${rays}</g><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" fill="#ffb000"/><text class="big" x="160" y="132" text-anchor="middle">${fmt(v)}</text><text class="sub" x="160" y="154" text-anchor="middle">${t ? `${Math.round(p * 100)} % de l'objectif · ${fmt(t)}` : 'Aucun objectif défini'}</text></svg>`;
}

function sizingCalc(p) {

  const mpptA = p.volt > 0 ? Math.ceil((installed / p.volt) * 1.25) : 0;
    const stringVocCold = series * p.panelVoc * 1.15;

}

/* ---------- Workflow intégré Étude → Devis → Stock → Chantier ---------- */
function matchStudyProduct(category, wantedPower=0) {
  const candidates = Store.all('products').filter(p => String(p.category||'').toLowerCase().includes(category.toLowerCase()));
  if (!candidates.length) return null;
  if (/c[âa]ble/i.test(category)) { const m = candidates.filter(p => p.unit === 'mètre'); if (m.length) return m[0]; }
  const power = p => {
    const m = String(p.name||'').match(/(\d+(?:[.,]\d+)?)\s*(?:wc|w|kw|kva|a)\b/i);
    return m ? parseFloat(m[1].replace(',','.')) : 0;
  };
  if (!wantedPower) return candidates[0];
  const rated = candidates.map(p=>({p,w:power(p)})).filter(x=>x.w>0);
  const normalized = rated.map(x=>({p:x.p,w:/\bkw\b|\bkva\b/i.test(String(x.p.name||''))?x.w*1000:x.w}));
  const compatible = normalized.filter(x=>Math.abs(x.w-wantedPower)/wantedPower<=0.15);
  return compatible.sort((a,b)=>Math.abs(a.w-wantedPower)-Math.abs(b.w-wantedPower))[0]?.p || null;
}
function studyMaterialPlan(params, result) {
  const items = [];
  const add = (category, description, qty, unit, fallbackPrice, wantedPower=0) => {
    if (!(qty > 0)) return;
    const product = matchStudyProduct(category, wantedPower);
    const unitPrice = product ? (+product.price||0) : (+fallbackPrice||0);
    items.push({
      id: uid('ML'), pid: product?.id || '', category, description,
      qty: Math.ceil(qty), unit: product?.unit || unit,
      unitPrice, cost: product ? (+product.cost||0) : (+fallbackPrice||0),
      stockAvailable: product ? (+product.stock||0) : 0,
      qtyToBuy: product ? Math.max(0, Math.ceil(qty)-(+product.stock||0)) : Math.ceil(qty),
      supplierId: product?.supplierId || '',
      catalogueLinked: !!product
    });
  };
  add('Panneau solaire', `Panneaux photovoltaïques ${params.panelWc} Wc`, result.panels, 'pièce', params.pricePanel, params.panelWc);
  if (params.system !== 'ongrid' && result.batWh > 0) {
    let battery = matchStudyProduct('Batterie');
    let batteryQty = Math.ceil(result.batWh/1000), batteryDesc = `Stockage ${fmtN(result.batWh/1000,2)} kWh (${params.volt} V)`;
    if (battery) {
      const v = String(battery.name||'').match(/(\d+(?:[.,]\d+)?)\s*v/i);
      const ah = String(battery.name||'').match(/(\d+(?:[.,]\d+)?)\s*ah/i), kwhM = String(battery.name||'').match(/(\d+(?:[.,]\d+)?)\s*kwh/i);
      if (!(v && ah) && kwhM) {
        batteryQty = Math.ceil(result.batWh/(parseFloat(kwhM[1].replace(',','.'))*1000));
        batteryDesc = `${battery.name} — capacité requise ${fmtN(result.batWh/1000,2)} kWh`;
      } else if (v && ah) {
        batteryQty = Math.ceil(result.batWh/(parseFloat(v[1].replace(',','.'))*parseFloat(ah[1].replace(',','.'))));
        batteryDesc = `${battery.name} — capacité requise ${fmtN(result.batWh/1000,2)} kWh`;
      } else battery = null;
    }
    add('Batterie', batteryDesc, batteryQty, battery?.unit || 'kWh', params.priceBatteryKwh*Math.ceil(result.batWh/1000));
  }
  add('Onduleur', `Onduleur ${fmtN(result.inverter,0)} W — architecture ${params.system}`, 1, 'pièce', params.priceInverterKw*result.inverter/1000, result.inverter);
  if (params.system !== 'ongrid') add('Régulateur', `Régulateur MPPT ${result.mpptA} A`, 1, 'pièce', params.priceMppt, result.mpptA);
  add('Câble', `Câbles DC/AC — longueur estimée ${2*(params.dcLength+params.acLength)} m`, 2*(params.dcLength+params.acLength), 'mètre', params.priceCableM);
  add('Protection', 'Coffrets et protections électriques adaptés à l’architecture', 1, 'lot', params.priceProtection);
  return items;
}
async function createStudyWorkflow(study) {
  if (!study || !study.projectId) throw new Error('Étude ou projet introuvable.');
  if (study.workflow?.status === 'connected') {
    toast('Cette version est déjà connectée aux modules.', 'warn');
    return;
  }
  const project = Store.byId('projects', study.projectId);
  if (!project) throw new Error('Projet lié introuvable.');
  const params = study.params, result = study.result;
  const materials = studyMaterialPlan(params, result);
  const quoteLines = materials.map(m => ({
    pid: m.pid, desc: m.description, qty: m.qty,
    price: m.pid ? (+Store.byId('products',m.pid)?.price||m.unitPrice) : m.unitPrice
  }));
  quoteLines.push(
    {pid:'',desc:'Main-d’œuvre d’installation',qty:1,price:+params.labor||0},
    {pid:'',desc:'Transport et logistique',qty:1,price:+params.transport||0}
  );
  if (+params.other > 0) quoteLines.push({pid:'',desc:'Autres frais',qty:1,price:+params.other});
  let quote = {
    id: docNumber(Store.all('quotes').map(x=>x.id).concat((Store.cache.quotes||[]).map(x=>x.id)), 'DV', new Date().getFullYear()),
    type:'devis', clientId:project.clientId, projectId:project.id, sourceStudyId:study.id,
    sourceStudyVersion:study.version, date:today(), dueDate:addDays(new Date().toISOString(),15).slice(0,10),
    status:'Brouillon', discount:0, vat:(+params.tax||0)>0, taxRate:+params.tax||taxRate(),
    notes:`Devis généré depuis l’étude de dimensionnement — ${project.name}, étude V${study.version}, architecture ${study.architectureLabel}. Les prix catalogue et quantités sont à confirmer avant envoi.`,
    lines:quoteLines, payments:[]
  };
  const prevDraft = Store.all('quotes').find(x => x.projectId === project.id && x.type === 'devis' && x.status === 'Brouillon' && x.sourceStudyId);
  if (prevDraft) { Object.assign(prevDraft, quote, { id: prevDraft.id, date: prevDraft.date }); quote = prevDraft; }
  await Store.save('quotes',quote);
  const purchaseIds = [];
  project.currentStudyId=study.id;
  project.currentStudyVersion=study.version;
  project.materialPlan=materials;
  project.quoteId=quote.id;
  project.budget=result.total;
  project.workflowStatus='Étude connectée — devis brouillon';
  await Store.save('projects',project);
  study.workflow={status:'connected',quoteId:quote.id,validatedAt:new Date().toISOString(),materials};
  await Store.save('studies',study);
  log(`Étude V${study.version} connectée : devis ${quote.id}, projet ${project.name}`);
  toast('Étude connectée : devis créé et besoins de stock calculés.');
}

/* ---------- Webhooks : réception, vérification, idempotence ---------- */
async function receiveWebhook(raw, sig) {
  const rec = { id: uid('W'), receivedAt: new Date().toISOString(), size: raw.length, sig: String(sig || '').slice(0, 24) + '…' };
  const done = async (status, reason, evt) => { Object.assign(rec, { status, reason: reason || '', type: evt && evt.type || '—', eventId: evt && evt.id || '' }); await Store.save('webhookEvents', rec); return rec; };
  let evt; try { evt = JSON.parse(raw); } catch { return done('rejected', 'Corps JSON invalide'); }
  const v = await verifySignature(Store.tenant.webhookSecret, raw, sig); if (!v.ok) return done('rejected', v.reason, evt);
  if (!evt.id) return done('rejected', 'Identifiant d\'évènement manquant', evt);
  if (Store.all('webhookEvents').some(e => e.eventId === evt.id && e.status === 'processed')) return done('duplicate', 'Évènement déjà traité (idempotence)', evt);
  const d = evt.data || {};
  if (evt.type === 'payment.succeeded' || evt.type === 'payment.failed') {
    const pay = Store.byId('payments', d.paymentId);
    if (!pay) return done('rejected', 'Paiement inconnu', evt);
    if (d.tenantId !== Store.tid) return done('rejected', 'Évènement destiné à un autre espace', evt);
    if (pay.status === 'paid') return done('duplicate', 'Paiement déjà confirmé', evt);
    if (evt.type === 'payment.succeeded') {
      if (+d.amount !== +pay.amount) return done('rejected', 'Montant incohérent avec la commande', evt);
      pay.status = 'paid'; pay.paidAt = new Date().toISOString(); await Store.save('payments', pay);
      await Store.saveTenant(planAfterPayment(Store.tenant, pay.planId, pay.months)); log(`Paiement confirmé ${pay.ref} — plan ${PLANS[pay.planId].label}`);
    } else { pay.status = 'failed'; pay.reason = d.reason || 'Refusé par l\'opérateur'; await Store.save('payments', pay); }
    return done('processed', '', evt);
  }
  return done('processed', 'Évènement sans effet métier', evt);
}
async function sendTestWebhook(kind) {
  const evt = { id: 'evt_' + uid(), type: 'ping', created: Math.floor(Date.now() / 1000), data: { message: 'Test de connectivité' } }, raw = JSON.stringify(evt);
  if (kind === 'valid') return receiveWebhook(raw, await signPayload(Store.tenant.webhookSecret, raw));
  if (kind === 'forged') return receiveWebhook(raw, await signPayload('whsec_mauvaise_cle', raw));
  if (kind === 'old') return receiveWebhook(raw, await signPayload(Store.tenant.webhookSecret, raw, Math.floor(Date.now() / 1000) - 3600));
  if (kind === 'replay') { const s = await signPayload(Store.tenant.webhookSecret, raw); await receiveWebhook(raw, s); return receiveWebhook(raw, s); }
}

    $('#payst').innerHTML = res === 'paid' ? `${ic('check')}<h4>Paiement confirmé</h4><p>Votre plan ${PLANS[plan].label} est actif jusqu'au ${dateFr(Store.tenant.planExpires)}.</p><button class="btn btn-p" data-act="dlg-close">Terminer</button>` : res === 'failed' ? `${ic('alert')}<h4>Paiement refusé</h4><p>${esc(Store.byId('payments', pay.id).reason || 'L\'opérateur a refusé la transaction.')}</p><button class="btn btn-o" data-act="dlg-close">Fermer</button>` : `${ic('alert')}<h4>Confirmation en attente</h4><p>Nous n'avons pas encore reçu la confirmation. Elle sera appliquée automatiquement dès réception.</p><button class="btn btn-o" data-act="dlg-close">Fermer</button>`;
    if (res === 'paid') log(`Abonnement ${PLANS[plan].label} (${months} mois) payé`);
  } catch (e) { const p = Store.byId('payments', pay.id); p.status = 'failed'; p.reason = e.message; await Store.save('payments', p); if ($('#payst')) $('#payst').innerHTML = `${ic('alert')}<h4>Paiement impossible</h4><p>${esc(e.message)}</p><button class="btn btn-o" data-act="dlg-close">Fermer</button>`; }
  if (currentPage() === 'billing') renderBilling($('#content'));
  renderTopState();
};
async function sandboxProvider(pay) {

  const evt = { id: 'evt_' + uid(), type: ok ? 'payment.succeeded' : 'payment.failed', created: Math.floor(Date.now() / 1000), data: { paymentId: pay.id, tenantId: Store.tid, amount: pay.amount, operator: pay.operator, reason: ok ? undefined : 'Solde insuffisant (simulation)' } };
  const raw = JSON.stringify(evt); await receiveWebhook(raw, await signPayload(Store.tenant.webhookSecret, raw));
}
async function waitPayment(id, timeout) {
  const t0 = Date.now();
  while (Date.now() - t0 < timeout) { await Store.refresh('payments'); const p = Store.byId('payments', id); if (p && p.status !== 'pending') return p.status; await sleep(1200); }
  return 'pending';
}

/* ---------- Mises à jour : vérification à la demande par lien ---------- */
const verNum = v => String(v || '').replace(/^v/i, '').split(/[.\-+]/).map(x => parseInt(x, 10) || 0);
const verCmp = (a, b) => { const x = verNum(a), y = verNum(b); for (let i = 0; i < Math.max(x.length, y.length, 3); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0 ? 1 : -1; } return 0; };
const UPD = { res: null, busy: false, auto: false };
const updCfg = () => LS.get('ss_update', {}) || {};
async function updCheck(url) {
  if (!/^https:\/\//i.test(url || '')) throw new Error('Le lien doit commencer par https://');
  if (!navigator.onLine) throw new Error('Pas de connexion Internet pour le moment.');
  let r; try { r = await fetch(url, { cache: 'no-store' }); } catch { throw new Error('Lien injoignable (réseau coupé, ou site qui n\'autorise pas la lecture depuis l\'application).'); }
  if (!r.ok) throw new Error(`Le lien a répondu « ${r.status} ». Vérifiez l'adresse.`);
  const txt = await r.text(); let version = '', link = url, notes = '';
  try { const j = JSON.parse(txt); version = String(j.version || ''); link = j.url || j.lien || url; notes = j.notes || j.nouveautes || ''; if (Array.isArray(notes)) notes = notes.join(' · '); }
  catch { const m = txt.match(/APP\s*=\s*\{[^}]*version:\s*'([^']+)'/); if (m) version = m[1]; }
  if (!version) throw new Error('Version introuvable dans ce lien : indiquez un fichier version.json ou le fichier SOLAR PRO lui-même.');
  if (!/^https:\/\//i.test(link)) link = url;
  return { version, url: link, notes: String(notes).slice(0, 600), newer: verCmp(version, APP.version) > 0, at: new Date().toISOString() };
}
function updResultHTML() {
  const r = UPD.res; if (UPD.busy) return `<div class="alert info">${ic('swap')}<span>Vérification en cours…</span></div>`;
  if (!r) return '';
  if (r.err) return `<div class="alert bad">${ic('alert')}<span>${esc(r.err)}</span></div>`;
  if (!r.newer) return `<div class="alert ok">${ic('check')}<div><b>Vous avez la dernière version (${esc(APP.version)}).</b><br><span class="muted">Dernière vérification : ${esc(new Date(r.at).toLocaleString('fr-FR'))}</span></div></div>`;
  return `<div class="alert warn">${ic('down')}<div><b>Mise à jour disponible : version ${esc(r.version)}</b> (vous avez la ${esc(APP.version)})${r.notes ? `<br>${esc(r.notes)}` : ''}</div></div>
  <ol class="muted" style="margin:10px 0 0 18px;display:grid;gap:4px"><li>Sauvegardez vos données (bouton ci-dessous).</li><li>Téléchargez la nouvelle version et ouvrez-la.</li><li>Dans Paramètres › Données, importez votre sauvegarde.</li></ol>
  <div class="row" style="margin-top:12px;gap:8px;flex-wrap:wrap"><button class="btn btn-o" data-act="set-export">${ic('save')}Sauvegarder mes données</button><a class="btn btn-p" href="${esc(r.url)}" target="_blank" rel="noopener" download>${ic('down')}Télécharger la version ${esc(r.version)}</a></div>`;
}

function imgToDataURL(file, px = 400, fmt = 'jpeg') {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Choisissez un fichier image (JPG, PNG…).'));
    if (file.size > 10e6) return rej(new Error('Image trop lourde (10 Mo maximum).'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, px / Math.max(img.naturalWidth, img.naturalHeight, 1)), w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
        const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
        if (fmt !== 'png') { x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); }
        x.drawImage(img, 0, 0, w, h);
        res(c.toDataURL(fmt === 'png' ? 'image/png' : 'image/jpeg', 0.78));
      } catch (e) { rej(e); } finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Image illisible.')); };
    img.src = url;
  });
}
