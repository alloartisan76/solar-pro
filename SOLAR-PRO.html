  const r = [];
  if (can('clients')) Store.all('clients').filter(c => [c.name, c.phone, c.city].join(' ').toLowerCase().includes(q)).slice(0, 4).forEach(c => r.push({ k: 'Client', l: c.name, m: c.city || c.phone || '', p: 'clients' }));
  if (can('products')) Store.all('products').filter(p => [p.name, p.ref].join(' ').toLowerCase().includes(q)).slice(0, 4).forEach(p => r.push({ k: 'Produit', l: p.name, m: p.ref, p: 'products' }));
  if (can('quotes')) Store.all('quotes').filter(x => x.id.toLowerCase().includes(q) || clientName(x.clientId).toLowerCase().includes(q)).slice(0, 4).forEach(x => r.push({ k: x.type === 'facture' ? 'Facture' : 'Devis', l: x.id, m: clientName(x.clientId), p: 'quotes', tab: x.type }));
  if (can('projects')) Store.all('projects').filter(x => x.name.toLowerCase().includes(q)).slice(0, 3).forEach(x => r.push({ k: 'Projet', l: x.name, m: clientName(x.clientId), p: 'projects' }));
  box.hidden = false;
  box.innerHTML = r.length ? r.map(x => `<button data-act="gs-go" data-p="${x.p}" data-q="${esc(x.l)}" data-tab="${x.tab || ''}"><span><span class="pill p-mute" style="margin-right:8px">${x.k}</span>${esc(x.l)}</span><small>${esc(x.m)}</small></button>`).join('') : '<div style="padding:14px" class="muted">Aucun résultat</div>';
}, 200);
ACT['gs-go'] = d => { window.__pendingQ = d.q; if (d.tab) QST.tab = d.tab; else if (LST[d.p]) LST[d.p].page = 1; $('#gres').hidden = true; $('#gs').value = ''; if (_page === d.p) { _page = null; } go(d.p); };

/* ---------- Écran d'accès ---------- */
function renderAuth(tab = 'login', msg = '') {
  const art = '<svg class="auth-art" viewBox="0 0 420 420" aria-hidden="true"><circle cx="210" cy="210" r="96" fill="#ffb000"/><g stroke="#ffb000" stroke-width="10" stroke-linecap="round" opacity=".55">' + Array.from({ length: 12 }, (_, i) => { const a = i * Math.PI / 6; return `<line x1="${210 + 130 * Math.cos(a)}" y1="${210 + 130 * Math.sin(a)}" x2="${210 + 170 * Math.cos(a)}" y2="${210 + 170 * Math.sin(a)}"/>`; }).join('') + '</g></svg>';
  const F = (k, l, type, extra = '') => `<div class="fld"><label for="a_${k}">${l}</label><input id="a_${k}" name="${k}" type="${type}" ${extra}></div>`;
  $('#root').innerHTML = `<div class="auth"><section class="auth-l"><div><div class="brand" style="padding:0">${SUN}<div>${APP.name}</div></div><h1>Votre activité solaire, du devis au chantier.</h1><p>Clients, stocks, factures, interventions et encaissements Mobile Money réunis dans un seul espace de travail.</p><ul><li>${ic('check')}<span>Devis et factures avec TVA configurable, imprimables en un clic</span></li><li>${ic('check')}<span>Abonnement payable par Orange Money, MTN MoMo, Wave…</span></li><li>${ic('check')}<span>Pensé pour le téléphone et les connexions lentes</span></li></ul></div>${art}<small style="color:#7fa497">Version ${APP.version} · ${Cloud.on ? 'mode cloud' : 'mode local'}</small></section>
  <section class="auth-r"><div class="abox">
  ${tab === 'reset' ? `<h2>Mot de passe oublié</h2><p class="muted" style="margin:6px 0 20px">Nous vous envoyons un lien de réinitialisation.</p><form data-form="auth-reset" novalidate><div class="ferr" role="alert"></div>${F('email', 'E-mail', 'email', 'autocomplete="email" required')}<button class="btn btn-p" type="submit">Envoyer le lien</button><p style="margin-top:14px;text-align:center"><button type="button" class="btn-g btn" style="width:auto" data-act="auth-tab" data-t="login">Retour à la connexion</button></p></form>`
    : `<h2>${tab === 'login' ? 'Bon retour' : 'Créer votre espace'}</h2><p class="muted" style="margin:6px 0 18px">${tab === 'login' ? 'Connectez-vous à votre espace.' : '15 jours d\'essai du plan Pro, sans carte bancaire.'}</p><div class="tabs" role="tablist"><button role="tab" aria-selected="${tab === 'login'}" data-act="auth-tab" data-t="login">Connexion</button><button role="tab" aria-selected="${tab === 'register'}" data-act="auth-tab" data-t="register">Créer mon espace</button></div>${msg ? `<div class="ferr" style="display:block">${esc(msg)}</div>` : ''}
    <form data-form="${tab === 'login' ? 'auth-login' : 'auth-register'}" novalidate><div class="ferr" role="alert"></div>${tab === 'register' ? F('name', 'Votre nom', 'text', 'autocomplete="name" required') + F('company', 'Nom de l\'entreprise', 'text', 'autocomplete="organization" required') : ''}${F('email', 'E-mail', 'email', 'autocomplete="email" required')}${F('password', 'Mot de passe', 'password', `autocomplete="${tab === 'login' ? 'current-password' : 'new-password'}" required`)}${tab === 'register' ? '<p class="hint faint" style="margin:-6px 0 14px;font-size:12.5px">8 caractères minimum, avec au moins une lettre et un chiffre.</p>' : ''}<button class="btn btn-p" type="submit">${tab === 'login' ? 'Se connecter' : 'Créer mon espace'}</button>${tab === 'login' ? `<p style="margin-top:12px;text-align:center"><button type="button" class="btn-g btn" style="width:auto;height:32px" data-act="auth-tab" data-t="reset">Mot de passe oublié ?</button></p>` : ''}</form>
    ${Cloud.on ? '' : `<div style="margin-top:22px;padding-top:18px;border-top:1px solid var(--line)"><button class="btn btn-o" data-act="auth-demo">${ic('sun')}Explorer avec des données d'exemple</button></div>`}`}</div></section></div>`;
  const f = $('input'); if (f) f.focus();
}
ACT['auth-tab'] = d => renderAuth(d.t);
async function enterApp() {
  const t = await Store.load(Auth.user.tid);
  if (!t) { await Auth.logout(); throw new Error('Espace introuvable : contactez votre administrateur.'); }
  await licRevalidate().catch(() => { });
  await Auth.members().catch(() => { });
  renderShell(); syncMenu(); route();
  if (!_page) go('dashboard', false);
}
const formVals = f => Object.fromEntries(new FormData(f));
ON_SUBMIT['auth-login'] = async f => { const v = formVals(f), e = Auth.validate(v, 'login'); if (e.length) return showErr(f, e); await Auth.login(v); await enterApp(); };
ON_SUBMIT['auth-register'] = async f => { const v = formVals(f), e = Auth.validate(v, 'register'); if (e.length) return showErr(f, e); await Auth.register(v); await enterApp(); toast('Bienvenue ! Votre essai Pro de 14 jours commence.'); };
ON_SUBMIT['auth-reset'] = async f => { const v = formVals(f); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email || '')) return showErr(f, ['Adresse e-mail invalide']); await Auth.resetPassword(v.email); renderAuth('login', ''); toast('Si ce compte existe, un e-mail vient d\'être envoyé.'); };
ACT['auth-demo'] = async () => {
  const f = { name: 'Awa Démo', email: 'demo@solarsaas.app', password: 'Demo12345', company: 'Solaire Démo SARL' };
  if (LS.get('ss_users', []).some(u => u.email === f.email)) await Auth.login(f);
  else { await Auth.register(f); await Store.load(Auth.user.tid); await seedDemo(); }
  await enterApp();
};

function onboarding() {
  if (Store.all('clients').length || Store.all('quotes').length || !can('admin')) return '';
  return `<div class="alert info" style="align-items:center;flex-wrap:wrap">${ic('sun')}<div style="flex:1;min-width:220px"><b>Bienvenue dans votre espace.</b> Trois étapes pour démarrer : renseigner votre entreprise, ajouter vos produits, puis créer votre premier client et son devis.</div><div class="row"><button class="btn btn-p btn-sm" data-act="go" data-p="settings">Mon entreprise</button><button class="btn btn-o btn-sm" data-act="set-demo">Charger des exemples</button></div></div>`;
}

/* ---------- Démarrage ---------- */
window.addEventListener('unhandledrejection', e => { console.error(e.reason); });
window.addEventListener('error', e => { console.error(e.error || e.message); });
(async function main() {
  const root = $('#root'); root.innerHTML = '<div class="auth-r" style="min-height:100vh"><div class="skeleton" style="width:180px"></div></div>';
  if (Cloud.on) {
    try { await cloudInit(); } catch (e) {
      console.error(e); root.innerHTML = `<div class="auth-r" style="min-height:100vh"><div class="abox"><h2>Connexion au cloud impossible</h2><p class="muted" style="margin:8px 0 18px">${esc(e.message)}. Vérifiez votre connexion et la configuration Firebase.</p><button class="btn btn-p" onclick="location.reload()">Réessayer</button><div style="height:10px"></div><button class="btn btn-o" data-act="set-local">Revenir au mode local</button></div></div>`; return;
    }
  }
  let ok = false; try { ok = await Auth.restore(); } catch (e) { console.error(e); }
  if (ok) { try { await enterApp(); } catch (e) { renderAuth('login', e.message); } } else renderAuth();
})();

</script>
</body>
</html>
